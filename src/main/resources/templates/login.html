<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Modern System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      transition: transform 0.3s ease;
    }

    .login-container:hover {
      transform: translateY(-5px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h2 {
      font-weight: 600;
      color: #4a4a4a;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
    }

    .form-control:focus {
      box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
      border-color: #764ba2;
    }

    .btn-login {
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .btn-login:hover {
      opacity: 0.9;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
    }

    .footer-links a {
      color: #764ba2;
      text-decoration: none;
    }

    /* Error message style */
    .error-msg {
      color: #e74c3c;
      background: #fdeaea;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <h2>Xush kelibsiz</h2>
    <p class="text-muted">Tizimga kirish uchun ma'lumotlarni kiriting</p>
  </div>

  <!--    <div th:if="${param.error}" class="error-msg">-->
  <!--        Login yoki parol xato!-->
  <!--    </div>-->

  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Foydalanuvchi nomi</label>
      <input type="text" class="form-control" id="username" name="usrn" placeholder="Username" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Parol</label>
      <input type="password" class="form-control" id="password" name="pass" placeholder="********" required>
    </div>

    <div class="d-grid">
      <button type="submit" class="btn btn-primary btn-login">Kirish</button>
    </div>
  </form>

  <div class="footer-links">
    <p>Accountingiz yo'qmi? <a href="#">Ro'yxatdan o'ting</a></p>
  </div>
</div>

</body>
</html>
