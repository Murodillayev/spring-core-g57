<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foydalanuvchilar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="navbar :: nav('users')"></div>
<div class="container mt-5">
    <h2 class="mb-4">Hozir ijarada turgan kitoblar</h2>

    <div th:if="${#lists.isEmpty(users)}" class="alert alert-info">
        Hozirda ijarada turgan kitob yo'q.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(users)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-success">
            <tr>
                <th>№</th>
                <th>Full name</th>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user , st: ${users}" th:object="${user}">
                <td th:text="${st.count}"></td>
                <td th:text="*{fullName}"></td>
                <td th:text="'@' + *{username}"></td>
                <td th:text="*{role}"></td>
                <td>-</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="btn btn-secondary mt-3">
        <i class="bi bi-house"></i> Bosh sahifa
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
