<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ijaradagi kitoblar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="navbar :: nav('rental')"></div>
<div class="container mt-5">
    <h2 class="mb-4">Hozir ijarada turgan kitoblar</h2>

    <div th:if="${#lists.isEmpty(rentals)}" class="alert alert-info">
        Hozirda ijarada turgan kitob yo'q.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(rentals)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-success">
            <tr>
                <th>Kitob nomi</th>
                <th>Ijarachi</th>
                <th>Ijara sanasi</th>
                <th>Amal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rentals}">
                <td th:text="${r.book.title}">Kitob nomi</td>
                <td th:text="${r.borrowerName}">Ijarachi</td>
                <td th:text="${r.createdAt}">Sana</td>
                <td>
                    <a th:href="@{/rentals/return/{id}(id=${r.id})}"
                       class="btn btn-sm btn-warning"
                       onclick="return confirm('Kitobni qaytarib olishni tasdiqlaysizmi?')">
                        <i class="bi bi-arrow-repeat"></i> Qaytarish
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="btn btn-secondary mt-3">
        <i class="bi bi-house"></i> Bosh sahifa
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
