<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitoblar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">📚 Kutubxona tizimi</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Bosh sahifa</a></li>
                <li class="nav-item"><a class="nav-link active" href="/books">Kitoblar</a></li>
                <li class="nav-item"><a class="nav-link" href="/rentals">Ijaralar</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Kitoblar ro'yxati</h2>
    <a href="/books/add" class="btn btn-success mb-3">
        <i class="bi bi-plus-lg"></i> Yangi kitob qo'shish
    </a>

    <!-- Agar kitoblar bo'lmasa xabar -->
    <div th:if="${#lists.isEmpty(books)}" class="alert alert-info">
        Hozircha kitoblar qo'shilmagan.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(books)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-primary">
            <tr>
                <th>Nomi</th>
                <th>Muallif</th>
                <th>ISBN</th>
                <th>Jami nusxa</th>
                <th>Mavjud nusxa</th>
                <th>Ijara</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${books}">
                <td th:text="${b.title}">Nomi</td>
                <td th:text="${b.author}">Muallif</td>
                <td th:text="${b.isbn}">ISBN</td>
                <td th:text="${b.totalCopies}">0</td>
                <td th:text="${b.totalCopies - b.rentedCopies}">0</td>
                <td>
                    <!-- Faqat mavjud nusxa > 0 bo'lsa ijara berish mumkin -->
                    <div th:if="${b.totalCopies - b.rentedCopies > 0}">
                        <form method="post" action="/rentals/rent" class="d-inline">
                            <input type="hidden" name="bookId" th:value="${b.id}">
                            <div class="input-group input-group-sm">
                                <input type="text" name="borrower" class="form-control"
                                       placeholder="Ijarachi ismi" required>
                                <button type="submit" class="btn btn-outline-primary">Ijara</button>
                            </div>
                        </form>
                    </div>
                    <span th:unless="${b.totalCopies - b.rentedCopies > 0}"
                          class="text-danger fw-bold">Mavjud emas</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="btn btn-secondary mt-3">
        <i class="bi bi-house"></i> Bosh sahifa
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
